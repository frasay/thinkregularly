<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>think regularly</title>
<meta name="description" content="A retro typewriter writing app. Pages, LCD mode, offline.">
<meta name="theme-color" content="#1a1917">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --vh:100vh;
  --ink:#1d1b16; --paper:#fdfbf4; --edge:#e4ded0;
  --bg:#1a1917; --bg2:#232220; --line:#3a3833; --txt:#e8e4da; --dim:#a39d90; --hot:#d2742f;
  --fs:19px; --lh:1.62; --ff:"VT323", monospace;
  --pw:min(760px, calc(100vw - 28px));
  --ph:calc(var(--pw) * 1.4142);
  --pad:clamp(20px, 4.2vw, 58px);
  --foot:30px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:"IBM Plex Mono",ui-monospace,monospace;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:var(--vh);width:100%;position:fixed;inset:0}

/* ---- top bar ---- */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.brand{font-family:"VT323",monospace;font-size:26px;line-height:1;color:var(--hot);white-space:nowrap;letter-spacing:.5px}
.brand span{opacity:.6}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
button,select{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.6px;color:var(--txt);background:#2c2a27;border:1px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer;white-space:nowrap}
button:hover,select:hover{background:#38352f;border-color:#565249}
button.on{background:var(--hot);border-color:var(--hot);color:#140f08;font-weight:600}
.sep{width:1px;height:20px;background:var(--line);flex:0 0 auto}

/* ---- paper ---- */
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#141311;padding:22px 0 46vh}
#pages{width:var(--pw);margin:0 auto}
.sheet{position:relative;width:100%;height:var(--ph);background:var(--paper);border:1px solid var(--edge);border-radius:2px;box-shadow:0 10px 26px rgba(0,0,0,.45);margin:0 0 26px;padding:var(--pad);padding-bottom:calc(var(--pad) * .5 + var(--foot));overflow:hidden}
.sheet .body{position:relative;height:100%;overflow:hidden}
.pageNum{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:3px;color:#9c9484;user-select:none}
pre.ro,textarea#ed{font:var(--fs)/var(--lh) var(--ff);color:var(--ink);margin:0;padding:0;border:0;width:100%;background:transparent;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;letter-spacing:0}
pre.ro{height:100%;overflow:hidden;cursor:text}
textarea#ed{height:100%;resize:none;outline:none;overflow:hidden;caret-color:var(--hot);display:block}
textarea#ed::selection{background:#f0c9a8}

/* ---- status ---- */
#status{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:6px 12px;background:var(--bg2);border-top:1px solid var(--line);font-size:11px;color:var(--dim);letter-spacing:.5px;overflow-x:auto;scrollbar-width:none}
#status::-webkit-scrollbar{display:none}
#stName{color:var(--txt);font-weight:600;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stPage{color:var(--hot)}
#stSaved{margin-left:auto;white-space:nowrap}

/* ---- LCD ---- */
#lcd{position:fixed;inset:0;z-index:60;background:#15150f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
#lcd[hidden]{display:none}
.bezel{width:min(900px,100%);background:#2b2b22;border:1px solid #3d3d31;border-radius:12px;padding:18px;box-shadow:inset 0 1px 0 #4c4c3e,0 20px 50px rgba(0,0,0,.6)}
.screen{background:#8fbf35;background-image:linear-gradient(180deg,#9ccb3e,#7fae2c);border-radius:5px;padding:16px 18px;box-shadow:inset 0 0 26px rgba(0,0,0,.35),0 0 26px rgba(143,191,53,.25);overflow:hidden}
.screen .row{font-family:"VT323",monospace;font-size:clamp(22px,4.6vw,40px);line-height:1.25;color:#17270a;white-space:pre;overflow:hidden;text-overflow:clip;min-height:1.25em}
.screen .row.dim{font-size:13px;letter-spacing:2px;color:#2e4312;opacity:.75;margin-top:8px}
#lcdCur{display:inline-block;width:.6em;background:#17270a;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.label{margin-top:10px;text-align:right;font-size:10px;letter-spacing:3px;color:#7d7d66}

/* ---- drawer ---- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);z-index:70;background:var(--bg2);border-left:1px solid var(--line);padding:14px;overflow-y:auto}
#drawer[hidden]{display:none}
#drawer h2{font-size:12px;letter-spacing:3px;color:var(--dim);margin:0 0 12px;text-transform:uppercase}
.dItem{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:5px;margin-bottom:7px;background:#262421}
.dItem.sel{border-color:var(--hot)}
.dItem .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dItem .mt{font-size:10px;color:var(--dim)}
.dItem button{padding:3px 6px;font-size:11px}

/* ---- drop mask ---- */
#mask{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(10,10,8,.86);font-family:"VT323",monospace;font-size:34px;color:var(--hot);letter-spacing:2px;border:3px dashed var(--hot);pointer-events:none}
#mask[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:95;background:#2c2a27;border:1px solid var(--line);border-radius:5px;padding:9px 14px;font-size:12px;color:var(--txt)}
#toast[hidden]{display:none}
@media (max-width:620px){.brand{font-size:21px}button,select{padding:7px 8px;font-size:10px}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">think<span>·</span>regularly</div>
    <div class="tools">
      <button id="bDrafts">DRAFTS</button>
      <button id="bNew" title="New draft (Ctrl+N)">NEW</button>
      <button id="bOpen" title="Open a .txt file (Ctrl+O)">OPEN .TXT</button>
      <button id="bExport" title="Export .txt (Ctrl+S)">EXPORT</button>
      <button id="bBackup" title="Back up every draft as JSON">BACKUP</button>
      <button id="bRestore" title="Restore drafts from a backup">RESTORE</button>
      <span class="sep"></span>
      <button id="bMinus" title="Smaller text">A&minus;</button>
      <button id="bPlus" title="Larger text">A+</button>
      <select id="selFont" title="Typeface"></select>
      <button id="bLcd" title="LCD one-liner mode (Ctrl+L)">LCD</button>
      <button id="bSound" title="Typewriter sound">&#9834; ON</button>
    </div>
  </header>
  <main id="scroll"><div id="pages"></div></main>
  <footer id="status">
    <span id="stName">untitled</span>
    <span id="stPage">PAGE 1 / 1</span>
    <span id="stWords">0 words</span>
    <span id="stChars">0 chars</span>
    <span id="stSaved">&nbsp;</span>
  </footer>
</div>

<textarea id="ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="sentences" aria-label="Writing area"></textarea>

<div id="lcd" hidden>
  <div class="bezel">
    <div class="screen">
      <div class="row"><span id="lcdLine"></span><span id="lcdCur">&nbsp;</span></div>
      <div class="row dim" id="lcdMeta">LN 1  PG 1/1</div>
    </div>
    <div class="label">THINK REGULARLY &middot; LCD-1</div>
  </div>
  <button id="lcdExit">EXIT LCD (CTRL+L)</button>
</div>

<aside id="drawer" hidden>
  <h2>Drafts</h2>
  <div id="dList"></div>
  <button id="dNew" style="width:100%;margin-top:8px">+ NEW DRAFT</button>
  <button id="dClose" style="width:100%;margin-top:6px">CLOSE</button>
</aside>

<div id="mask" hidden>DROP A .TXT FILE TO OPEN</div>
<div id="toast" hidden></div>
<input type="file" id="fTxt" accept=".txt,.md,text/plain" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var LS={d:'tr.v21.drafts',c:'tr.v21.current',s:'tr.v21.settings'};
var OLD=['tr.drafts.v2','tr.drafts','thinkregularly.drafts','thinkregularly:drafts','drafts'];
var FONTS=[
  {n:'VT323',css:'"VT323", monospace',k:1.3},
  {n:'Courier Prime',css:'"Courier Prime", monospace',k:1},
  {n:'IBM Plex Mono',css:'"IBM Plex Mono", monospace',k:.98},
  {n:'Libre Baskerville',css:'"Libre Baskerville", Georgia, serif',k:.92}
];
var SIZES=[15,17,19,22,26,30];
var S={font:0,size:2,sound:true,lcd:false};

var ed=$('#ed'),scrollEl=$('#scroll'),pagesEl=$('#pages');
var drafts=[],curId=null,text='',caret=0,active=0;
var PG={lines:[[0,0]],lpp:28,pages:[[0,0]]};
var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
var wcache={},contentW=600,lineH=30,saveT=null,renderQ=false,lastKey='';

/* ---------- settings ---------- */
function loadSettings(){try{var o=JSON.parse(localStorage.getItem(LS.s)||'{}');for(var k in o)if(k in S)S[k]=o[k];}catch(e){}
  S.font=Math.min(FONTS.length-1,Math.max(0,S.font|0));S.size=Math.min(SIZES.length-1,Math.max(0,S.size|0));}
function saveSettings(){try{localStorage.setItem(LS.s,JSON.stringify(S));}catch(e){}}
function applyFont(){
  var f=FONTS[S.font],px=Math.round(SIZES[S.size]*f.k);
  document.documentElement.style.setProperty('--ff',f.css);
  document.documentElement.style.setProperty('--fs',px+'px');
  $('#selFont').selectedIndex=S.font;
  wcache={};
  ctx.font=px+'px '+f.css;
  saveSettings();
  measure();reflow(true);
}

/* ---------- drafts ---------- */
function uid(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function loadDrafts(){
  var raw=null;try{raw=localStorage.getItem(LS.d);}catch(e){}
  if(!raw){for(var i=0;i<OLD.length;i++){try{var r=localStorage.getItem(OLD[i]);if(r){raw=r;break;}}catch(e){}}}
  try{var a=JSON.parse(raw||'[]');if(Array.isArray(a))drafts=a.map(function(d){return{id:d.id||uid(),name:d.name||d.title||'untitled',text:(typeof d.text==='string'?d.text:(d.body||d.content||'')),created:d.created||Date.now(),updated:d.updated||Date.now()};});}catch(e){drafts=[];}
  if(!drafts.length)drafts=[{id:uid(),name:'first thoughts',text:'think regularly\n\nType. The page feeds up as you go, like paper through a platen.\nPress Ctrl+L for the little green LCD. Ctrl+O opens a .txt.\n\n',created:Date.now(),updated:Date.now()}];
  try{curId=localStorage.getItem(LS.c);}catch(e){}
  if(!find(curId))curId=drafts[0].id;
}
function find(id){for(var i=0;i<drafts.length;i++)if(drafts[i].id===id)return drafts[i];return null;}
function persist(){try{localStorage.setItem(LS.d,JSON.stringify(drafts));localStorage.setItem(LS.c,curId);}catch(e){}}
function scheduleSave(){
  if(saveT)clearTimeout(saveT);
  $('#stSaved').textContent='saving…';
  saveT=setTimeout(function(){
    var d=find(curId);if(d){d.text=text;d.updated=Date.now();}
    persist();
    $('#stSaved').textContent='saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  },420);
}
function openDraft(id,noFocus){
  var d=find(id);if(!d)return;
  var c=find(curId);if(c){c.text=text;c.updated=Date.now();}
  curId=id;text=d.text;caret=text.length;active=0;persist();
  reflow(true);
  scrollEl.scrollTop=0;
  if(!noFocus)ed.focus();
  drawDrafts();
}
function newDraft(name,body){
  var d={id:uid(),name:name||('untitled '+(drafts.length+1)),text:body||'',created:Date.now(),updated:Date.now()};
  drafts.unshift(d);persist();openDraft(d.id);return d;
}

/* ---------- measuring + wrapping ---------- */
function cwid(ch){var w=wcache[ch];if(w===undefined){w=ctx.measureText(ch).width;wcache[ch]=w;}return w;}
function measure(){
  if(!pagesEl.firstChild)pagesEl.appendChild(makeSheet());
  var body=pagesEl.firstChild.querySelector('.body');
  var cs=getComputedStyle(ed);
  var lh=parseFloat(cs.lineHeight);
  if(!lh||isNaN(lh))lh=parseFloat(cs.fontSize)*1.62;
  lineH=lh;
  contentW=Math.max(80,body.clientWidth||pagesEl.clientWidth);
  ctx.font=cs.fontSize+' '+FONTS[S.font].css;
  var h=body.clientHeight||(parseFloat(getComputedStyle(pagesEl.firstChild).height)-80);
  PG.lpp=Math.max(6,Math.floor(h/lineH));
}
function wrapAll(t){
  var lines=[],lineStart=0,lastSpace=-1,w=0,i,ch,c,brk,j;
  for(i=0;i<t.length;i++){
    ch=t.charAt(i);
    if(ch==='\n'){lines.push([lineStart,i]);lineStart=i+1;lastSpace=-1;w=0;continue;}
    c=cwid(ch);
    if(w+c>contentW&&i>lineStart){
      brk=(lastSpace>lineStart)?lastSpace+1:i;
      lines.push([lineStart,brk]);
      lineStart=brk;lastSpace=-1;w=0;
      for(j=lineStart;j<=i;j++)w+=cwid(t.charAt(j));
    }else{w+=c;}
    if(ch===' ')lastSpace=i;
  }
  lines.push([lineStart,t.length]);
  return lines;
}
function paginate(){
  var lines=wrapAll(text),lpp=PG.lpp,pages=[],p=0,a,nx,b;
  while(p*lpp<lines.length){
    a=lines[p*lpp][0];nx=(p+1)*lpp;
    b=nx<lines.length?lines[nx][0]:text.length;
    pages.push([a,b]);p++;
  }
  if(!pages.length)pages.push([0,0]);
  PG.lines=lines;PG.pages=pages;
}
function lineIndexOf(off){
  var L=PG.lines,lo=0,hi=L.length-1,mid,r=0;
  while(lo<=hi){mid=(lo+hi)>>1;if(L[mid][0]<=off){r=mid;lo=mid+1;}else hi=mid-1;}
  return r;
}

/* ---------- rendering ---------- */
function makeSheet(){
  var s=document.createElement('div');s.className='sheet';
  s.innerHTML='<div class="body"></div><div class="pageNum"></div>';
  return s;
}
function reflow(force){
  paginate();
  var n=PG.pages.length;
  var li=lineIndexOf(caret);
  active=Math.min(Math.floor(li/PG.lpp),n-1);
  while(pagesEl.children.length<n)pagesEl.appendChild(makeSheet());
  var body=pagesEl.children[active].querySelector('.body');
  var hadFocus=(document.activeElement===ed);
  if(ed.parentNode!==body){body.innerHTML='';body.appendChild(ed);if(hadFocus)ed.focus();}
  while(pagesEl.children.length>n)pagesEl.removeChild(pagesEl.lastChild);
  for(var i=0;i<n;i++){
    var sh=pagesEl.children[i];
    sh.querySelector('.pageNum').textContent='— '+(i+1)+' —';
    if(i===active)continue;
    var b=sh.querySelector('.body'),t=text.slice(PG.pages[i][0],PG.pages[i][1]);
    var pre=b.querySelector('pre');
    if(!pre){b.innerHTML='';pre=document.createElement('pre');pre.className='ro';b.appendChild(pre);}
    if(pre.textContent!==t)pre.textContent=t;
  }
  var at=text.slice(PG.pages[active][0],PG.pages[active][1]);
  var local=Math.max(0,Math.min(at.length,caret-PG.pages[active][0]));
  if(ed.value!==at||force){ed.value=at;try{ed.setSelectionRange(local,local);}catch(e){}}
  updateStatus();updateLcd();
}
var rq=null;
function queueReflow(){if(rq)return;rq=requestAnimationFrame(function(){rq=null;reflow(false);});}
function updateStatus(){
  var d=find(curId);
  $('#stName').textContent=d?d.name:'untitled';
  $('#stPage').textContent='PAGE '+(active+1)+' / '+PG.pages.length;
  var w=text.trim()?text.trim().split(/\s+/).length:0;
  $('#stWords').textContent=w+' words';
  $('#stChars').textContent=text.length+' chars';
}

/* ---------- caret-follow scrolling ---------- */
var anim=null;
function reduced(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
function smooth(to){
  to=Math.max(0,Math.min(to,scrollEl.scrollHeight-scrollEl.clientHeight));
  var from=scrollEl.scrollTop,d=to-from;
  if(Math.abs(d)<1.5)return;
  if(reduced()){scrollEl.scrollTop=to;return;}
  if(anim)cancelAnimationFrame(anim);
  var t0=performance.now(),dur=Math.min(420,180+Math.abs(d)*0.25);
  function step(t){
    var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    scrollEl.scrollTop=from+d*e;
    anim=k<1?requestAnimationFrame(step):null;
  }
  anim=requestAnimationFrame(step);
}
function caretY(){
  var li=lineIndexOf(caret),inPage=li%PG.lpp,pg=Math.min(Math.floor(li/PG.lpp),pagesEl.children.length-1);
  var sh=pagesEl.children[pg];if(!sh)return 0;
  var padTop=parseFloat(getComputedStyle(sh).paddingTop)||0;
  return sh.offsetTop+padTop+inPage*lineH;
}
function followCaret(){
  var y=caretY(),h=scrollEl.clientHeight;
  smooth(y-h*0.6+lineH/2);
}

/* ---------- LCD ---------- */
function currentLine(){
  var li=lineIndexOf(caret),l=PG.lines[li]||[0,0];
  return{i:li,txt:text.slice(l[0],Math.max(l[0],l[1]))};
}
function updateLcd(){
  if(!S.lcd)return;
  var c=currentLine(),t=c.txt;
  if(t.length>64)t=t.slice(t.length-64);
  $('#lcdLine').textContent=t;
  $('#lcdMeta').textContent='LN '+(c.i+1)+'   PG '+(active+1)+'/'+PG.pages.length+'   '+(text.trim()?text.trim().split(/\s+/).length:0)+'W';
}
function setLcd(on){
  S.lcd=!!on;saveSettings();
  $('#lcd').hidden=!S.lcd;
  $('#bLcd').classList.toggle('on',S.lcd);
  if(S.lcd){updateLcd();ed.focus();}else{ed.focus();followCaret();}
}

/* ---------- audio ---------- */
var ac=null,noise=null;
function actx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function noiseBuf(a){
  if(noise)return noise;
  var len=Math.floor(a.sampleRate*0.05);
  noise=a.createBuffer(1,len,a.sampleRate);
  var d=noise.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);
  return noise;
}
function clack(kind){
  if(!S.sound)return;var a=actx();if(!a)return;var t=a.currentTime;
  var src=a.createBufferSource();src.buffer=noiseBuf(a);
  var bp=a.createBiquadFilter();bp.type='bandpass';
  bp.frequency.value=kind==='space'?820:kind==='enter'?1250:1750+Math.random()*420;
  bp.Q.value=1.1;
  var g=a.createGain();g.gain.setValueAtTime(kind==='space'?0.1:0.16,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
  src.connect(bp);bp.connect(g);g.connect(a.destination);src.start(t);src.stop(t+0.07);
  if(kind==='enter'){
    var o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(1860,t);
    var og=a.createGain();og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.2,t+0.006);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
    o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+0.6);
  }
}

/* ---------- files ---------- */
function dl(name,data,mime){
  var b=new Blob([data],{type:mime||'text/plain;charset=utf-8'});
  var u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},800);
}
function toast(m){var e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(function(){e.hidden=true;},2200);}
function openTextFile(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var nm=(file.name||'opened.txt').replace(/\.(txt|md|text)$/i,'');
    newDraft(nm,String(r.result||''));
    toast('opened “'+nm+'”');
  };
  r.readAsText(file);
}

/* ---------- drafts drawer ---------- */
function drawDrafts(){
  var w=$('#dList');w.innerHTML='';
  drafts.forEach(function(d){
    var row=document.createElement('div');row.className='dItem'+(d.id===curId?' sel':'');
    var nm=document.createElement('div');nm.className='nm';
    nm.textContent=d.name;nm.title=d.name;
    nm.onclick=function(){openDraft(d.id);$('#drawer').hidden=true;};
    var rn=document.createElement('button');rn.textContent='✎';rn.title='Rename';
    rn.onclick=function(){var v=prompt('Rename draft',d.name);if(v){d.name=v.trim()||d.name;persist();drawDrafts();updateStatus();}};
    var rm=document.createElement('button');rm.textContent='✕';rm.title='Delete';
    rm.onclick=function(){
      if(!confirm('Delete “'+d.name+'”?'))return;
      drafts=drafts.filter(function(x){return x.id!==d.id;});
      if(!drafts.length)drafts=[{id:uid(),name:'untitled',text:'',created:Date.now(),updated:Date.now()}];
      if(curId===d.id){curId=drafts[0].id;text=drafts[0].text;caret=0;reflow(true);}
      persist();drawDrafts();updateStatus();
    };
    row.appendChild(nm);row.appendChild(rn);row.appendChild(rm);
    w.appendChild(row);
  });
}

/* ---------- viewport (mobile keyboard) ---------- */
function setVH(){
  var vv=window.visualViewport;
  var h=vv?vv.height:window.innerHeight;
  document.documentElement.style.setProperty('--vh',h+'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){setVH();setTimeout(followCaret,60);});
  window.visualViewport.addEventListener('scroll',setVH);
}
window.addEventListener('resize',function(){setVH();measure();reflow(true);});
window.addEventListener('orientationchange',function(){setTimeout(function(){setVH();measure();reflow(true);},250);});

/* ---------- editor events ---------- */
ed.addEventListener('keydown',function(e){
  lastKey=e.key==='Enter'?'enter':e.key===' '?'space':'key';
  if(e.key==='Enter'||e.key==='Backspace'||e.key.length===1)clack(lastKey);
});
ed.addEventListener('input',function(){
  var st=PG.pages[active]||[0,0];
  text=text.slice(0,st[0])+ed.value+text.slice(st[1]);
  caret=st[0]+ed.selectionStart;
  queueReflow();scheduleSave();
  requestAnimationFrame(followCaret);
});
function syncCaret(){
  if(document.activeElement!==ed)return;
  var st=PG.pages[active]||[0,0];
  caret=st[0]+ed.selectionStart;
  updateLcd();updateStatus();
}
document.addEventListener('selectionchange',syncCaret);
ed.addEventListener('click',function(){syncCaret();});
ed.addEventListener('keyup',function(e){
  if(e.key.indexOf('Arrow')===0||e.key==='Home'||e.key==='End'||e.key==='PageUp'||e.key==='PageDown'){syncCaret();followCaret();}
});
/* click an inactive page to move the caret there */
pagesEl.addEventListener('mousedown',function(e){
  var pre=e.target.closest?e.target.closest('pre.ro'):null;if(!pre)return;
  var sh=pre.closest('.sheet');var idx=Array.prototype.indexOf.call(pagesEl.children,sh);if(idx<0)return;
  var r=pre.getBoundingClientRect();
  var ln=Math.max(0,Math.floor((e.clientY-r.top)/lineH));
  var gi=Math.min(PG.lines.length-1,idx*PG.lpp+ln);
  var L=PG.lines[gi],x=e.clientX-r.left,acc=0,off=L[0];
  for(var i=L[0];i<L[1];i++){var w=cwid(text.charAt(i));if(acc+w/2>x)break;acc+=w;off=i+1;}
  caret=off;reflow(true);ed.focus();
  setTimeout(followCaret,0);
});

/* ---------- toolbar ---------- */
$('#bDrafts').onclick=function(){var d=$('#drawer');d.hidden=!d.hidden;if(!d.hidden)drawDrafts();};
$('#dClose').onclick=function(){$('#drawer').hidden=true;};
$('#dNew').onclick=function(){var n=prompt('Name this draft','untitled');newDraft(n||'untitled','');drawDrafts();};
$('#bNew').onclick=function(){var n=prompt('Name this draft','untitled');newDraft(n||'untitled','');};
$('#bOpen').onclick=function(){$('#fTxt').click();};
$('#fTxt').onchange=function(e){openTextFile(e.target.files&&e.target.files[0]);e.target.value='';};
$('#bExport').onclick=function(){var d=find(curId);dl(((d&&d.name)||'think-regularly').replace(/[^\w\- ]+/g,'')+'.txt',text);};
$('#bBackup').onclick=function(){
  var c=find(curId);if(c)c.text=text;
  dl('think-regularly-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'think regularly',version:'2.1',exported:Date.now(),drafts:drafts},null,2),'application/json');
};
$('#bRestore').onclick=function(){$('#fJson').click();};
$('#fJson').onchange=function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result)),list=Array.isArray(o)?o:o.drafts;
      if(!Array.isArray(list))throw 0;
      list.forEach(function(d){if(!find(d.id))drafts.push({id:d.id||uid(),name:d.name||'restored',text:d.text||'',created:d.created||Date.now(),updated:d.updated||Date.now()});});
      persist();drawDrafts();toast('restored '+list.length+' draft(s)');
    }catch(err){toast('that file was not a backup');}
  };
  r.readAsText(f);e.target.value='';
};
$('#bMinus').onclick=function(){if(S.size>0){S.size--;applyFont();}};
$('#bPlus').onclick=function(){if(S.size<SIZES.length-1){S.size++;applyFont();}};
$('#selFont').onchange=function(e){S.font=e.target.selectedIndex;applyFont();};
$('#bLcd').onclick=function(){setLcd(!S.lcd);};
$('#lcdExit').onclick=function(){setLcd(false);};
$('#lcd').addEventListener('click',function(e){if(e.target.id!=='lcdExit')ed.focus();});
$('#bSound').onclick=function(){S.sound=!S.sound;saveSettings();$('#bSound').textContent=S.sound?'\u266A ON':'\u266A OFF';$('#bSound').classList.toggle('on',S.sound);if(S.sound)clack('key');};

/* ---------- shortcuts ---------- */
document.addEventListener('keydown',function(e){
  var m=e.ctrlKey||e.metaKey;if(!m)return;
  var k=e.key.toLowerCase();
  if(k==='l'){e.preventDefault();setLcd(!S.lcd);}
  else if(k==='o'){e.preventDefault();$('#fTxt').click();}
  else if(k==='s'){e.preventDefault();$('#bExport').click();}
  else if(k==='n'){e.preventDefault();$('#bNew').click();}
});

/* ---------- drag & drop ---------- */
var dragN=0;
window.addEventListener('dragenter',function(e){e.preventDefault();dragN++;$('#mask').hidden=false;});
window.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='copy';});
window.addEventListener('dragleave',function(e){e.preventDefault();dragN=Math.max(0,dragN-1);if(!dragN)$('#mask').hidden=true;});
window.addEventListener('drop',function(e){
  e.preventDefault();dragN=0;$('#mask').hidden=true;
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f){ if(/\.json$/i.test(f.name)){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(String(r.result));var l=Array.isArray(o)?o:o.drafts;l.forEach(function(d){drafts.push({id:uid(),name:d.name||'restored',text:d.text||'',created:Date.now(),updated:Date.now()});});persist();drawDrafts();toast('restored');}catch(x){toast('bad backup file');}};r.readAsText(f);}
    else openTextFile(f); }
});

/* ---------- PWA ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
if('launchQueue' in window && 'files' in LaunchParams.prototype){
  window.launchQueue.setConsumer(function(p){
    if(!p||!p.files||!p.files.length)return;
    p.files.forEach(function(h){h.getFile().then(openTextFile);});
  });
}

/* ---------- boot ---------- */
function boot(){
  FONTS.forEach(function(f){var o=document.createElement('option');o.textContent=f.n;$('#selFont').appendChild(o);});
  loadSettings();loadDrafts();
  var d=find(curId);text=d?d.text:'';caret=text.length;
  $('#bSound').textContent=S.sound?'\u266A ON':'\u266A OFF';
  $('#bSound').classList.toggle('on',S.sound);
  setVH();
  pagesEl.appendChild(makeSheet());
  applyFont();
  setLcd(S.lcd);
  drawDrafts();
  $('#stSaved').textContent='saved';
  ed.focus();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){wcache={};measure();reflow(true);});
  setTimeout(function(){measure();reflow(true);},400);
}
boot();
})();
</script>
</body>
</html>
