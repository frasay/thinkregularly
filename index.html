<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>think regularly</title>
<meta name="description" content="A quiet pixel place for writers. Autosaves as you write. Sounds like a 90s electric typewriter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23fdf3cf'/%3E%3Crect x='5' y='1' width='6' height='3' fill='%23fffef4'/%3E%3Crect x='2' y='4' width='12' height='2' fill='%236b5f44'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%23e8d9ae'/%3E%3Crect x='5' y='8' width='6' height='1' fill='%234a4432'/%3E%3Crect x='1' y='10' width='14' height='1' fill='%234a4432'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#fdf3cf;
    --sky-bot:#fbe3bd;
    --paper:#fffdf0;
    --paper-deep:#fbf3d9;
    --ink:#4a4432;
    --ink-soft:#8a8266;
    --ink-faint:#bfb493;
    --accent:#e86a5e;
    --mint:#7fc8a9;
    --gold:#ffd96b;
    --rule:#e4dcc0;
    --shadow:rgba(74,68,50,.28);
    --px-font:'Press Start 2P', monospace;
    --body-font:'VT323','Courier New', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--body-font);
    -webkit-font-smoothing:none;
    overflow-x:hidden;
  }
  ::selection{ background:#ead9a8; }

  /* ---------- CRT scanlines ---------- */
  body::after{
    content:'';
    position:fixed; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(74,68,50,.035) 0 1px, transparent 1px 3px);
    z-index:40;
  }

  /* ---------- sky decorations ---------- */
  .sky{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .sun{ position:absolute; top:3vh; right:6vw; width:72px; height:72px; animation:sunbob 6s ease-in-out infinite; }
  @keyframes sunbob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }
  .cloud{ position:absolute; width:110px; opacity:.85; }
  .cloud.c1{ top:9vh;  animation:drift 120s linear infinite; }
  .cloud.c2{ top:22vh; width:80px; opacity:.6; animation:drift 170s linear infinite; animation-delay:-60s; }
  .cloud.c3{ top:34vh; width:140px; opacity:.45; animation:drift 210s linear infinite; animation-delay:-130s; }
  @keyframes drift{ from{ transform:translateX(-20vw);} to{ transform:translateX(115vw);} }

  /* ---------- page card ---------- */
  .wrap{
    position:relative; z-index:1;
    max-width:46rem;
    margin:0 auto;
    padding:3.2rem 1rem 8rem;
  }
  .brand{
    text-align:center;
    font-family:var(--px-font);
    font-size:.68rem;
    letter-spacing:.18em;
    color:var(--ink-soft);
    margin-bottom:1.1rem;
    user-select:none;
  }
  .brand .cur{
    display:inline-block; width:.6em; height:.9em;
    background:var(--accent);
    vertical-align:-0.12em;
    margin-left:.35em;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .machine{
    display:block; margin:0 auto .9rem; width:112px; height:auto;
    image-rendering:pixelated;
    user-select:none;
  }
  .machine.typing{ animation:jig .12s steps(2) 1; }
  @keyframes jig{ 50%{ transform:translateY(2px); } }

  .paper{
    background:var(--paper);
    border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--shadow);
    padding:2.4rem 2.6rem 2.8rem;
    cursor:text;
    min-height:62vh;
  }
  #title{
    width:100%;
    border:0; outline:0; background:transparent;
    font-family:var(--body-font);
    font-size:2.1rem;
    color:var(--ink);
    caret-color:var(--accent);
    padding:0 0 .3rem;
    border-bottom:3px dashed transparent;
    transition:border-color .2s;
  }
  #title:focus{ border-bottom-color:var(--rule); }
  #title::placeholder{ color:var(--ink-faint); }
  .title-hint{
    font-family:var(--px-font);
    font-size:.5rem; letter-spacing:.08em;
    color:var(--ink-faint);
    height:1rem; margin:.45rem 0 1.4rem;
    opacity:0; transition:opacity .25s;
  }
  #title:focus ~ .title-hint{ opacity:1; }
  #editor{
    width:100%;
    border:0; outline:0; background:transparent; resize:none;
    font-family:var(--body-font);
    font-size:1.45rem;
    line-height:1.6;
    color:var(--ink);
    caret-color:var(--accent);
    min-height:46vh;
    overflow:hidden;
  }
  #editor::placeholder{ color:var(--ink-faint); }

  /* ---------- footer bar ---------- */
  .bar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between;
    gap:.6rem;
    padding:.8rem 1rem 1rem;
    z-index:20;
    background:linear-gradient(to top, var(--sky-bot) 60%, rgba(251,227,189,0));
    user-select:none;
  }
  .bar .grp{ display:flex; gap:.55rem; align-items:center; flex-wrap:wrap; }
  .pxbtn{
    font-family:var(--px-font);
    font-size:.55rem;
    letter-spacing:.06em;
    color:var(--ink);
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--shadow);
    padding:.5rem .65rem .45rem;
    cursor:pointer;
    transition:none;
  }
  .pxbtn:hover{ background:var(--paper-deep); }
  .pxbtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }
  .pxbtn.snd-off{ background:#eee4c4; color:var(--ink-soft); }
  .stat{
    font-family:var(--px-font);
    font-size:.5rem; letter-spacing:.08em;
    color:var(--ink-soft);
    padding:.2rem .1rem;
  }
  #saveState.saving{ color:var(--accent); animation:blink 0.7s steps(1) infinite; }
  #saveState.saved{ color:var(--mint); }

  /* ---------- drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(74,68,50,.25);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:25;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:min(21.5rem,88vw);
    background:var(--paper-deep);
    border-right:4px solid var(--ink);
    box-shadow:8px 0 0 var(--shadow);
    transform:translateX(-110%);
    transition:transform .26s cubic-bezier(.2,.8,.25,1);
    display:flex; flex-direction:column;
    z-index:30;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer header{
    padding:1.1rem 1.1rem .85rem;
    font-family:var(--px-font);
    font-size:.55rem; letter-spacing:.14em; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:3px solid var(--rule);
  }
  .drawer header button{
    border:0; background:none; cursor:pointer;
    font-family:var(--px-font); font-size:.55rem;
    color:var(--accent); letter-spacing:.06em;
  }
  .doc-list{ flex:1; overflow-y:auto; padding:.6rem; }
  .doc{
    padding:.55rem .6rem; cursor:pointer;
    border:3px solid transparent;
    display:flex; justify-content:space-between; align-items:center; gap:.5rem;
    margin-bottom:.35rem;
  }
  .doc:hover{ border-color:var(--rule); background:var(--paper); }
  .doc.current{ border-color:var(--ink); background:var(--paper); box-shadow:3px 3px 0 var(--shadow); }
  .doc .t{
    font-family:var(--body-font);
    font-size:1.25rem;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .doc .meta{
    font-family:var(--px-font);
    font-size:.42rem; color:var(--ink-faint); margin-top:.25rem; letter-spacing:.06em;
  }
  .doc .del{
    border:0; background:none; cursor:pointer; color:var(--ink-faint);
    font-family:var(--px-font); font-size:.5rem;
    visibility:hidden; padding:.2rem;
  }
  .doc:hover .del{ visibility:visible; }
  .doc .del:hover{ color:var(--accent); }
  .drawer footer{
    padding:.85rem 1.1rem 1rem; border-top:3px solid var(--rule);
    display:flex; gap:.55rem; flex-wrap:wrap;
  }

  /* scrollbars */
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:var(--paper-deep); }
  ::-webkit-scrollbar-thumb{ background:var(--ink-faint); border:2px solid var(--paper-deep); }

  @media (max-width:640px){
    .wrap{ padding-top:2rem; }
    .paper{ padding:1.4rem 1.2rem 2rem; box-shadow:5px 5px 0 var(--shadow); }
    #title{ font-size:1.7rem; }
    #editor{ font-size:1.3rem; }
    .machine{ width:88px; }
    .stat{ display:none; }
    .stat.always{ display:block; }
  }
  @media print{ .bar,.sky,.drawer,.scrim,.brand,.machine{ display:none; } body::after{ display:none; } .paper{ border:0; box-shadow:none; } }
</style>
</head>
<body>

<!-- pixel sky -->
<div class="sky" aria-hidden="true">
  <svg class="sun" viewBox="0 0 11 11" shape-rendering="crispEdges">
    <rect x="4" y="0" width="3" height="1" fill="#ffd96b"/>
    <rect x="4" y="10" width="3" height="1" fill="#ffd96b"/>
    <rect x="0" y="4" width="1" height="3" fill="#ffd96b"/>
    <rect x="10" y="4" width="1" height="3" fill="#ffd96b"/>
    <rect x="3" y="2" width="5" height="7" fill="#ffce4f"/>
    <rect x="2" y="3" width="7" height="5" fill="#ffce4f"/>
    <rect x="4" y="3" width="3" height="5" fill="#ffd96b"/>
    <rect x="3" y="4" width="5" height="3" fill="#ffd96b"/>
    <rect x="4" y="4" width="1" height="1" fill="#fff3c4"/>
  </svg>
  <svg class="cloud c1" viewBox="0 0 13 6" shape-rendering="crispEdges">
    <rect x="3" y="0" width="5" height="2" fill="#ffffff"/>
    <rect x="1" y="2" width="10" height="2" fill="#ffffff"/>
    <rect x="0" y="4" width="13" height="2" fill="#ffffff"/>
  </svg>
  <svg class="cloud c2" viewBox="0 0 13 6" shape-rendering="crispEdges">
    <rect x="4" y="0" width="4" height="2" fill="#ffffff"/>
    <rect x="2" y="2" width="9" height="2" fill="#ffffff"/>
    <rect x="0" y="4" width="13" height="2" fill="#ffffff"/>
  </svg>
  <svg class="cloud c3" viewBox="0 0 13 6" shape-rendering="crispEdges">
    <rect x="3" y="0" width="6" height="2" fill="#ffffff"/>
    <rect x="1" y="2" width="11" height="2" fill="#ffffff"/>
    <rect x="0" y="4" width="13" height="2" fill="#ffffff"/>

</div>

<div class="wrap">
  <div class="brand">THINK REGULARLY<span class="cur"></span></div>

  <!-- pixel typewriter -->
  <svg class="machine" id="machine" viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="5" y="0" width="6" height="4" fill="#fffef4"/>
    <rect x="6" y="1" width="4" height="1" fill="#cfc49e"/>
    <rect x="6" y="2" width="3" height="1" fill="#cfc49e"/>
    <rect x="1" y="4" width="1" height="2" fill="#4a4432"/>
    <rect x="14" y="4" width="1" height="2" fill="#4a4432"/>
    <rect x="2" y="4" width="12" height="2" fill="#6b5f44"/>
    <rect x="2" y="6" width="12" height="4" fill="#e8d9ae"/>
    <rect x="3" y="7" width="1" height="1" fill="#4a4432"/>
    <rect x="5" y="7" width="1" height="1" fill="#4a4432"/>
    <rect x="7" y="7" width="1" height="1" fill="#4a4432"/>
    <rect x="9" y="7" width="1" height="1" fill="#4a4432"/>
    <rect x="11" y="7" width="1" height="1" fill="#4a4432"/>
    <rect x="12" y="7" width="1" height="1" fill="#e86a5e"/>
    <rect x="5" y="8" width="6" height="1" fill="#4a4432"/>
    <rect x="2" y="9" width="12" height="1" fill="#d7c9a3"/>
    <rect x="1" y="10" width="14" height="1" fill="#4a4432"/>
  </svg>

  <main class="paper" id="page">
    <input id="title" type="text" placeholder="Untitled" spellcheck="false" autocomplete="off" maxlength="120">
    <div class="title-hint">NAME YOUR PIECE — ENTER TO START WRITING</div>
    <textarea id="editor" placeholder="start writing…" spellcheck="true"></textarea>
  </main>
</div>

<div class="bar">
  <div class="grp">
    <button class="pxbtn" id="drawerBtn" title="Your pieces (Ctrl+K)">DRAFTS</button>
    <button class="pxbtn" id="newBtn" title="New piece">+ NEW</button>
  </div>
  <div class="grp">
    <span class="stat" id="saveState">SAVED</span>
    <span class="stat always" id="wordCount">0 WORDS</span>
    <button class="pxbtn" id="soundBtn" title="Toggle typewriter sound (Ctrl+M)">SND ON</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Your pieces">
  <header>
    <span>YOUR PIECES</span>
    <button id="drawerNewBtn">+ NEW</button>
  </header>
  <div class="doc-list" id="docList"></div>
  <footer>
    <button class="pxbtn" id="exportTxtBtn" title="Download the current piece as a .txt file">SAVE .TXT</button>
    <button class="pxbtn" id="backupBtn" title="Download all pieces as a .json backup">BACKUP ALL</button>
  </footer>
</aside>

<script>
(function(){
'use strict';

/* =========================================================
   think regularly v2 — pixel edition
   zero build deps · localStorage autosave · Web Audio keys
   ========================================================= */

var STORE_KEY = 'thinkregularly.v1';
var SOUND_KEY = 'thinkregularly.sound';

/* ---------- state ---------- */
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function freshDoc(){ return { id: uid(), title: '', body: '', created: now(), updated: now() }; }

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.docs && s.docs.length) return s;
    }
  }catch(e){}
  var d = freshDoc();
  return { docs:[d], currentId:d.id };
}
var state = loadState();

function currentDoc(){
  for(var i=0;i<state.docs.length;i++){
    if(state.docs[i].id === state.currentId) return state.docs[i];
  }
  state.currentId = state.docs[0].id;
  return state.docs[0];
}

/* ---------- elements ---------- */
var $title   = document.getElementById('title');
var $editor  = document.getElementById('editor');
var $page    = document.getElementById('page');
var $save    = document.getElementById('saveState');
var $words   = document.getElementById('wordCount');
var $soundBtn= document.getElementById('soundBtn');
var $drawer  = document.getElementById('drawer');
var $scrim   = document.getElementById('scrim');
var $docList = document.getElementById('docList');
var $machine = document.getElementById('machine');

/* ---------- autosave ---------- */
var saveTimer = null;
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  $save.textContent = 'SAVED';
  $save.classList.remove('saving');
  $save.classList.add('saved');
}
function scheduleSave(){
  $save.textContent = 'SAVING';
  $save.classList.add('saving');
  $save.classList.remove('saved');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}
function saveNow(){ clearTimeout(saveTimer); persist(); }

/* ---------- editor wiring ---------- */
function autogrow(){
  $editor.style.height = 'auto';
  $editor.style.height = ($editor.scrollHeight + 2) + 'px';
}
function updateWordCount(){
  var n = $editor.value.trim() ? $editor.value.trim().split(/\s+/).length : 0;
  $words.textContent = n + (n === 1 ? ' WORD' : ' WORDS');
}
function updateTabTitle(){
  var t = $title.value.trim();
  document.title = t ? (t + ' — think regularly') : 'think regularly';
}
function loadDocIntoEditor(){
  var d = currentDoc();
  $title.value = d.title;
  $editor.value = d.body;
  autogrow();
  updateWordCount();
  updateTabTitle();
}

var jigTimer = null;
function jiggle(){
  $machine.classList.remove('typing');
  void $machine.offsetWidth; /* restart animation */
  $machine.classList.add('typing');
  clearTimeout(jigTimer);
  jigTimer = setTimeout(function(){ $machine.classList.remove('typing'); }, 150);
}

$editor.addEventListener('input', function(){
  var d = currentDoc();
  d.body = $editor.value;
  d.updated = now();
  autogrow();
  updateWordCount();
  scheduleSave();
});
$title.addEventListener('input', function(){
  var d = currentDoc();
  d.title = $title.value;
  d.updated = now();
  updateTabTitle();
  scheduleSave();
});
$title.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); $editor.focus(); }
});
$page.addEventListener('mousedown', function(e){
  if(e.target === $page){
    e.preventDefault();
    $editor.focus();
    $editor.setSelectionRange($editor.value.length, $editor.value.length);
  }
});
window.addEventListener('beforeunload', saveNow);

/* =========================================================
   SOUND ENGINE — 90s electric typewriter, synthesized live.
   v2 fix: browsers suspend AudioContext until a user gesture
   *registered by us*. We now init + resume on ANY pointer,
   key, or touch event (capture phase), route audio through a
   compressor, and raised the gain. Sound pref persists.
   ========================================================= */
var Snd = {
  enabled: localStorage.getItem(SOUND_KEY) !== 'off',
  ctx: null,
  master: null,
  noiseBuf: null,
  variants: [
    { f: 2600, q: 0.9, dur: 0.055, vol: 0.62, thump: 170 },
    { f: 2100, q: 1.1, dur: 0.060, vol: 0.58, thump: 150 },
    { f: 3100, q: 0.8, dur: 0.050, vol: 0.55, thump: 185 },
    { f: 1800, q: 1.2, dur: 0.065, vol: 0.60, thump: 140 }
  ],
  init: function(){
    if(this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ this.enabled = false; return; }
    this.ctx = new AC();
    var comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 20;
    comp.ratio.value = 6;
    comp.attack.value = 0.002;
    comp.release.value = 0.12;
    comp.connect(this.ctx.destination);
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.65;
    this.master.connect(comp);
    var len = Math.floor(this.ctx.sampleRate * 0.25);
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var ch = this.noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) ch[i] = Math.random() * 2 - 1;
  },
  unlock: function(){
    this.init();
    if(this.ctx && this.ctx.state === 'suspended'){
      try{ this.ctx.resume(); }catch(e){}
    }
  },
  ready: function(){
    if(!this.enabled) return false;
    this.unlock();
    return !!this.ctx;
  },
  burst: function(freq, q, dur, vol){
    var t = this.ctx.currentTime;
    var src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    var bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = q;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.03);
  },
  thump: function(freq, vol, dur){
    var t = this.ctx.currentTime;
    var o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(55, t + dur * 0.8);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  key: function(){
    if(!this.ready()) return;
    var v = this.variants[Math.floor(Math.random() * this.variants.length)];
    var jitter = 0.85 + Math.random() * 0.3;
    this.burst(v.f * jitter, v.q, v.dur, v.vol * (0.85 + Math.random() * 0.3));
    this.thump(v.thump * jitter, 0.28, 0.045);
  },
  space: function(){
    if(!this.ready()) return;
    this.burst(600 + Math.random() * 150, 1.4, 0.075, 0.6);
    this.thump(110, 0.38, 0.06);
  },
  backspace: function(){
    if(!this.ready()) return;
    this.burst(1400 + Math.random() * 200, 1.2, 0.045, 0.38);
    this.thump(130, 0.2, 0.04);
  },
  enter: function(){
    if(!this.ready()) return;
    this.burst(900, 1.1, 0.09, 0.55);
    this.thump(95, 0.4, 0.08);
    var t = this.ctx.currentTime + 0.05;
    var freqs = [1244.5, 2489.0];
    for(var i=0;i<freqs.length;i++){
      var o = this.ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freqs[i];
      var g = this.ctx.createGain();
      var peak = i === 0 ? 0.24 : 0.08;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + 1.0);
    }
  },
  toggle: function(){
    this.enabled = !this.enabled;
    try{ localStorage.setItem(SOUND_KEY, this.enabled ? 'on' : 'off'); }catch(e){}
    $soundBtn.textContent = this.enabled ? 'SND ON' : 'SND OFF';
    $soundBtn.classList.toggle('snd-off', !this.enabled);
    if(this.enabled){
      this.unlock();
      var s = this;
      setTimeout(function(){ s.key(); }, 40); /* confirmation clack */
    }
  }
};

/* unlock audio on the first (and any) user gesture — the v1 bug */
function unlockAudio(){
  if(Snd.enabled) Snd.unlock();
}
['pointerdown','keydown','touchstart'].forEach(function(ev){
  window.addEventListener(ev, unlockAudio, true);
});

function handleKeySound(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  jiggle();
  if(k === 'Enter'){ Snd.enter(); return; }
  if(k === ' ' || k === 'Spacebar'){ Snd.space(); return; }
  if(k === 'Backspace' || k === 'Delete'){ Snd.backspace(); return; }
  if(k.length === 1 || k === 'Tab'){ Snd.key(); }
}
$editor.addEventListener('keydown', handleKeySound);
$title.addEventListener('keydown', handleKeySound);
$soundBtn.addEventListener('click', function(){ Snd.toggle(); });

/* =========================================================
   DRAFTS DRAWER
   ========================================================= */
function fmtDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short' }).toUpperCase() +
         ' · ' +
         d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' }).toUpperCase();
}

function renderDocList(){
  $docList.innerHTML = '';
  var sorted = state.docs.slice().sort(function(a,b){ return b.updated - a.updated; });
  sorted.forEach(function(d){
    var row = document.createElement('div');
    row.className = 'doc' + (d.id === state.currentId ? ' current' : '');

    var left = document.createElement('div');
    left.style.minWidth = '0';
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = d.title.trim() || 'Untitled';
    var m = document.createElement('div');
    m.className = 'meta';
    m.textContent = fmtDate(d.updated);
    left.appendChild(t); left.appendChild(m);

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'DEL';
    del.title = 'Delete this piece';
    del.addEventListener('click', function(ev){
      ev.stopPropagation();
      var name = d.title.trim() || 'Untitled';
      if(!confirm('Delete "' + name + '"? This cannot be undone.')) return;
      state.docs = state.docs.filter(function(x){ return x.id !== d.id; });
      if(!state.docs.length){
        var nd = freshDoc();
        state.docs.push(nd);
        state.currentId = nd.id;
      } else if(state.currentId === d.id){
        state.currentId = state.docs[0].id;
      }
      saveNow();
      loadDocIntoEditor();
      renderDocList();
    });

    row.appendChild(left);
    row.appendChild(del);
    row.addEventListener('click', function(){
      state.currentId = d.id;
      saveNow();
      loadDocIntoEditor();
      closeDrawer();
      $editor.focus();
    });
    $docList.appendChild(row);
  });
}

function openDrawer(){
  renderDocList();
  $drawer.classList.add('open');
  $scrim.classList.add('open');
}
function closeDrawer(){
  $drawer.classList.remove('open');
  $scrim.classList.remove('open');
}
function drawerIsOpen(){ return $drawer.classList.contains('open'); }

function newPiece(){
  var d = freshDoc();
  state.docs.push(d);
  state.currentId = d.id;
  saveNow();
  loadDocIntoEditor();
  closeDrawer();
  $title.focus();
}

document.getElementById('drawerBtn').addEventListener('click', function(){
  drawerIsOpen() ? closeDrawer() : openDrawer();
});
document.getElementById('newBtn').addEventListener('click', newPiece);
document.getElementById('drawerNewBtn').addEventListener('click', newPiece);
$scrim.addEventListener('click', closeDrawer);

/* ---------- export ---------- */
function download(filename, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function safeName(s){
  return (s.trim() || 'untitled').replace(/[^a-z0-9 _-]/gi, '').trim().replace(/\s+/g, '-').toLowerCase() || 'untitled';
}
document.getElementById('exportTxtBtn').addEventListener('click', function(){
  var d = currentDoc();
  var head = (d.title.trim() || 'Untitled') + '\n\n';
  download(safeName(d.title) + '.txt', head + d.body);
});
document.getElementById('backupBtn').addEventListener('click', function(){
  download('think-regularly-backup-' + new Date().toISOString().slice(0,10) + '.json',
           JSON.stringify(state, null, 2), 'application/json');
});

/* ---------- global shortcuts ---------- */
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm'){ e.preventDefault(); Snd.toggle(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); drawerIsOpen() ? closeDrawer() : openDrawer(); }
  if(e.key === 'Escape' && drawerIsOpen()){ closeDrawer(); $editor.focus(); }
});

/* ---------- boot ---------- */
$soundBtn.textContent = Snd.enabled ? 'SND ON' : 'SND OFF';
$soundBtn.classList.toggle('snd-off', !Snd.enabled);
loadDocIntoEditor();
window.addEventListener('resize', autogrow);
if(!$editor.value && !$title.value){ $title.focus(); } else { $editor.focus(); }

})();
</script>
</body>
