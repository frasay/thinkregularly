<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>think regularly</title>
<meta name="description" content="A quiet 8-bit place for writers. Autosaves as you write. Sounds like a 90s electric typewriter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23fbf3d7'/%3E%3Crect x='2' y='2' width='12' height='12' fill='none' stroke='%234a3f2a' stroke-width='2'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf3d7;          /* warm light-yellow page */
    --sheet:#fffbe9;
    --ink:#4a3f2a;
    --ink-soft:#8d7f5a;
    --ink-faint:#c2b68e;
    --gold:#f2c14e;
    --gold-hi:#ffd36e;
    --coral:#e8703f;
    --mint:#79d6b5;
    --shadow:rgba(74,63,42,.28);
    --px-font:'Press Start 2P', monospace;
    --body-font:'VT323', 'Courier New', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body-font);
    overflow-x:hidden;
  }
  ::selection{ background:#f0dc9c; }

  /* ---------- CRT scanlines + vignette ---------- */
  .scanlines{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(74,63,42,.045) 0 1px, transparent 1px 3px);
  }
  .vignette{
    position:fixed; inset:0; z-index:59; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 62%, rgba(74,63,42,.10) 100%);
  }

  /* ---------- pixel sky: sun + drifting clouds ---------- */
  .sun{
    position:fixed; top:54px; right:56px; z-index:0; opacity:.9;
    image-rendering:pixelated;
  }
  .cloud{
    position:fixed; z-index:0; width:10px; height:10px; background:transparent;
    animation:drift linear infinite;
  }
  .cloud i{
    position:absolute; width:10px; height:10px; background:#fff;
  }
  .c1{ top:110px; opacity:.65; animation-duration:150s; }
  .c2{ top:230px; opacity:.45; animation-duration:210s; animation-delay:-80s; }
  .c3{ top:70px;  opacity:.5;  animation-duration:180s; animation-delay:-140s; }
  @keyframes drift{
    from{ transform:translateX(-140px); }
    to{ transform:translateX(calc(100vw + 140px)); }
  }

  /* ---------- top banner ---------- */
  .brand{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:center; align-items:center; gap:.7rem;
    padding:1rem 0 .8rem;
    pointer-events:none; user-select:none;
    font-family:var(--px-font); font-size:.6rem; letter-spacing:.32em;
    color:var(--ink-soft);
    text-shadow:2px 2px 0 rgba(74,63,42,.12);
  }
  .brand .dot{ color:var(--coral); }

  /* ---------- the sheet ---------- */
  .page{
    max-width:46rem; margin:0 auto;
    padding:4.6rem 1.1rem 7.5rem;
    position:relative; z-index:1;
  }
  .sheet{
    background:var(--sheet);
    border:3px solid var(--ink);
    box-shadow:8px 8px 0 var(--shadow);
    padding:2.1rem 2.3rem 2.5rem;
    min-height:72vh;
    cursor:text;
  }
  #title{
    width:100%;
    border:0; outline:0; background:transparent;
    font-family:var(--body-font);
    font-size:2.15rem; font-weight:700;
    color:var(--ink);
    caret-color:var(--coral);
    padding:0 0 .3rem;
    border-bottom:3px dashed transparent;
    transition:border-color .2s;
  }
  #title:focus{ border-bottom-color:var(--ink-faint); }
  #title::placeholder{ color:var(--ink-faint); }
  .title-hint{
    font-family:var(--px-font); font-size:.48rem; letter-spacing:.1em;
    color:var(--ink-faint);
    height:1rem; margin:.45rem 0 1.4rem;
    opacity:0; transition:opacity .25s;
  }
  #title:focus ~ .title-hint{ opacity:1; }
  #editor{
    width:100%;
    border:0; outline:0; background:transparent; resize:none;
    font-family:var(--body-font);
    font-size:1.5rem; line-height:1.5;
    color:var(--ink);
    caret-color:var(--coral);
    min-height:55vh;
    overflow:hidden;
  }
  #editor::placeholder{ color:var(--ink-faint); }

  /* ---------- pixel buttons ---------- */
  .pxbtn{
    font-family:var(--px-font); font-size:.52rem;
    padding:.6rem .65rem .55rem;
    background:var(--gold); color:var(--ink);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    cursor:pointer; letter-spacing:.06em;
    user-select:none;
  }
  .pxbtn:hover{ background:var(--gold-hi); }
  .pxbtn:active{ transform:translate(3px,3px); box-shadow:none; }
  .pxbtn.ghost{ background:var(--sheet); }
  .pxbtn.ghost:hover{ background:#fff4c8; }

  /* ---------- status bar ---------- */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:.8rem;
    padding:.7rem .9rem;
    background:var(--sheet);
    border-top:3px solid var(--ink);
    user-select:none;
  }
  .bar .grp{ display:flex; gap:.6rem; align-items:center; }
  .stat{
    font-family:var(--px-font); font-size:.5rem; letter-spacing:.08em;
    color:var(--ink-soft); white-space:nowrap;
  }
  #saveState.dim{ opacity:.5; }
  .led{
    width:12px; height:12px;
    border:3px solid var(--ink);
    background:#ddd4b8;
    transition:background .08s;
  }
  .led.on{ background:var(--mint); box-shadow:0 0 7px var(--mint); }

  /* ---------- drafts drawer ---------- */
  .scrim{
    position:fixed; inset:0; z-index:29; background:rgba(74,63,42,.25);
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; left:0; bottom:0; z-index:30;
    width:min(22rem,88vw);
    background:#f7eecf;
    border-right:3px solid var(--ink);
    box-shadow:6px 0 0 var(--shadow);
    transform:translateX(-110%);
    transition:transform .26s cubic-bezier(.2,.8,.25,1);
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer header{
    padding:1.1rem 1rem .9rem;
    display:flex; justify-content:space-between; align-items:center; gap:.5rem;
    border-bottom:3px solid var(--ink);
    font-family:var(--px-font); font-size:.52rem; letter-spacing:.2em;
    color:var(--ink-soft);
  }
  .doc-list{ flex:1; overflow-y:auto; padding:.8rem; }
  .doc{
    background:var(--sheet);
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--shadow);
    padding:.55rem .65rem;
    margin-bottom:.7rem;
    cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:.5rem;
  }
  .doc:hover{ background:#fff4c8; }
  .doc.current{ background:#ffe9ad; }
  .doc .t{
    font-size:1.25rem; line-height:1.15;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .doc .meta{
    font-family:var(--px-font); font-size:.42rem; color:var(--ink-soft);
    margin-top:.25rem; letter-spacing:.06em;
  }
  .doc .del{
    border:0; background:none; cursor:pointer;
    font-family:var(--px-font); font-size:.42rem;
    color:var(--ink-faint); padding:.3rem .2rem;
    visibility:hidden;
  }
  .doc:hover .del{ visibility:visible; }
  .doc .del:hover{ color:var(--coral); }
  .drawer footer{
    padding:.9rem; border-top:3px solid var(--ink);
    display:flex; gap:.6rem;
  }

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar{ width:12px; }
  ::-webkit-scrollbar-track{ background:var(--paper); }
  ::-webkit-scrollbar-thumb{ background:var(--ink-faint); border:3px solid var(--paper); }

  @media (max-width:640px){
    .page{ padding:4rem .6rem 7.5rem; }
    .sheet{ padding:1.3rem 1.1rem 1.6rem; }
    #title{ font-size:1.7rem; }
    #editor{ font-size:1.3rem; }
    .brand{ font-size:.5rem; }
    .sun{ right:16px; top:46px; }
    .bar{ flex-wrap:wrap; }
  }
  @media print{
    .bar,.brand,.drawer,.scrim,.sun,.cloud,.scanlines,.vignette{ display:none; }
    .sheet{ border:0; box-shadow:none; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<!-- pixel sun -->
<svg class="sun" width="72" height="72" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
  <rect x="5" y="5" width="6" height="6" fill="#f2b84b"/>
  <rect x="6" y="6" width="3" height="3" fill="#ffd36e"/>
  <rect x="7" y="1" width="2" height="2" fill="#f2b84b"/>
  <rect x="7" y="13" width="2" height="2" fill="#f2b84b"/>
  <rect x="1" y="7" width="2" height="2" fill="#f2b84b"/>
  <rect x="13" y="7" width="2" height="2" fill="#f2b84b"/>
  <rect x="3" y="3" width="2" height="2" fill="#f2b84b"/>
  <rect x="11" y="3" width="2" height="2" fill="#f2b84b"/>
  <rect x="3" y="11" width="2" height="2" fill="#f2b84b"/>
  <rect x="11" y="11" width="2" height="2" fill="#f2b84b"/>
</svg>

<!-- drifting pixel clouds -->
<div class="cloud c1" aria-hidden="true">
  <i style="left:20px;top:0"></i><i style="left:30px;top:0"></i><i style="left:40px;top:0"></i>
  <i style="left:0;top:10px"></i><i style="left:10px;top:10px"></i><i style="left:20px;top:10px"></i>
  <i style="left:30px;top:10px"></i><i style="left:40px;top:10px"></i><i style="left:50px;top:10px"></i>
</div>
<div class="cloud c2" aria-hidden="true">
  <i style="left:10px;top:0"></i><i style="left:20px;top:0"></i>
  <i style="left:0;top:10px"></i><i style="left:10px;top:10px"></i><i style="left:20px;top:10px"></i><i style="left:30px;top:10px"></i>
</div>
<div class="cloud c3" aria-hidden="true">
  <i style="left:30px;top:0"></i><i style="left:40px;top:0"></i><i style="left:50px;top:0"></i>
  <i style="left:10px;top:10px"></i><i style="left:20px;top:10px"></i><i style="left:30px;top:10px"></i>
  <i style="left:40px;top:10px"></i><i style="left:50px;top:10px"></i><i style="left:60px;top:10px"></i>
</div>

<div class="brand">THINK <span class="dot">■</span> REGULARLY</div>

<main class="page">
  <div class="sheet" id="sheet">
    <input id="title" type="text" placeholder="Untitled" spellcheck="false" autocomplete="off" maxlength="120">
    <div class="title-hint">NAME YOUR PIECE — ENTER TO WRITE</div>
    <textarea id="editor" placeholder="start writing…" spellcheck="true"></textarea>
  </div>
</main>

<div class="bar">
  <div class="grp">
    <button class="pxbtn" id="drawerBtn" title="Your pieces (Ctrl+K)">DRAFTS</button>
    <button class="pxbtn ghost" id="newBtn" title="New piece">+ NEW</button>
  </div>
  <div class="grp">
    <span class="led" id="led" title="typing light"></span>
    <span class="stat" id="saveState">SAVED</span>
    <span class="stat" id="wordCount">0 WORDS</span>
    <button class="pxbtn ghost" id="soundBtn" title="Toggle typewriter sound (Ctrl+M)">SND:ON</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Your pieces">
  <header>
    <span>YOUR PIECES</span>
    <button class="pxbtn" id="drawerNewBtn">+ NEW</button>
  </header>
  <div class="doc-list" id="docList"></div>
  <footer>
    <button class="pxbtn ghost" id="exportTxtBtn" title="Download the current piece as .txt">SAVE .TXT</button>
    <button class="pxbtn ghost" id="backupBtn" title="Download everything as .json">BACKUP ALL</button>
  </footer>
</aside>

<script>
(function(){
'use strict';

/* =========================================================
   think regularly v2 — a quiet 8-bit place for writers
   localStorage autosave · synthesized typewriter audio
   ========================================================= */

var STORE_KEY = 'thinkregularly.v1';
var SOUND_KEY = 'thinkregularly.sound';

/* ---------- state ---------- */
function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function freshDoc(){ return { id: uid(), title: '', body: '', created: now(), updated: now() }; }

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.docs && s.docs.length) return s;
    }
  }catch(e){}
  var d = freshDoc();
  return { docs:[d], currentId:d.id };
}
var state = loadState();

function currentDoc(){
  for(var i=0;i<state.docs.length;i++){
    if(state.docs[i].id === state.currentId) return state.docs[i];
  }
  state.currentId = state.docs[0].id;
  return state.docs[0];
}

/* ---------- elements ---------- */
var $title   = document.getElementById('title');
var $editor  = document.getElementById('editor');
var $sheet   = document.getElementById('sheet');
var $save    = document.getElementById('saveState');
var $words   = document.getElementById('wordCount');
var $soundBtn= document.getElementById('soundBtn');
var $drawer  = document.getElementById('drawer');
var $scrim   = document.getElementById('scrim');
var $docList = document.getElementById('docList');
var $led     = document.getElementById('led');

/* ---------- autosave ---------- */
var saveTimer = null;
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  $save.textContent = 'SAVED';
  $save.classList.add('dim');
}
function scheduleSave(){
  $save.textContent = 'SAVING…';
  $save.classList.remove('dim');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}
function saveNow(){ clearTimeout(saveTimer); persist(); }

/* ---------- editor wiring ---------- */
function autogrow(){
  $editor.style.height = 'auto';
  $editor.style.height = ($editor.scrollHeight + 2) + 'px';
}
function updateWordCount(){
  var n = $editor.value.trim() ? $editor.value.trim().split(/\s+/).length : 0;
  $words.textContent = n + (n === 1 ? ' WORD' : ' WORDS');
}
function updateTabTitle(){
  var t = $title.value.trim();
  document.title = t ? (t + ' — think regularly') : 'think regularly';
}
function loadDocIntoEditor(){
  var d = currentDoc();
  $title.value = d.title;
  $editor.value = d.body;
  autogrow();
  updateWordCount();
  updateTabTitle();
}

$editor.addEventListener('input', function(){
  var d = currentDoc();
  d.body = $editor.value;
  d.updated = now();
  autogrow();
  updateWordCount();
  scheduleSave();
});
$title.addEventListener('input', function(){
  var d = currentDoc();
  d.title = $title.value;
  d.updated = now();
  updateTabTitle();
  scheduleSave();
});
$title.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); $editor.focus(); }
});
$sheet.addEventListener('mousedown', function(e){
  if(e.target === $sheet){
    e.preventDefault();
    $editor.focus();
    $editor.setSelectionRange($editor.value.length, $editor.value.length);
  }
});
window.addEventListener('beforeunload', saveNow);

/* =========================================================
   SOUND — 90s electric typewriter, synthesized in code.

   v2 FIX: browsers create AudioContext in a 'suspended'
   state and resume() is async. v1 scheduled sounds before
   the resume finished, so they were silently dropped.
   Every sound now runs through go(), which waits for the
   context to actually be running. Audio is also unlocked
   on the first pointerdown/keydown anywhere on the page.
   ========================================================= */
var Snd = {
  enabled: (function(){
    try{ return localStorage.getItem(SOUND_KEY) !== 'off'; }catch(e){ return true; }
  })(),
  ctx: null,
  master: null,
  noiseBuf: null,
  variants: [
    { f: 2600, q: 0.9, dur: 0.060, vol: 0.85, thump: 170 },
    { f: 2100, q: 1.1, dur: 0.065, vol: 0.80, thump: 150 },
    { f: 3100, q: 0.8, dur: 0.055, vol: 0.75, thump: 185 },
    { f: 1800, q: 1.2, dur: 0.070, vol: 0.82, thump: 140 }
  ],

  init: function(){
    if(this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ this.enabled = false; return; }
    this.ctx = new AC();
    var comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 6;
    this.master = this.ctx.createGain();
    this.master.gain.value = 1.0;
    this.master.connect(comp);
    comp.connect(this.ctx.destination);
    var len = Math.floor(this.ctx.sampleRate * 0.25);
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var ch = this.noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++) ch[i] = Math.random() * 2 - 1;
  },

  /* run fn only once the context is genuinely running */
  go: function(fn){
    if(!this.enabled) return;
    this.init();
    if(!this.ctx) return;
    var self = this;
    if(this.ctx.state === 'running'){
      fn.call(self);
    } else {
      var p = this.ctx.resume();
      if(p && p.then){
        p.then(function(){ fn.call(self); }).catch(function(){});
      } else {
        fn.call(self);
      }
    }
  },

  burst: function(freq, q, dur, vol){
    var t = this.ctx.currentTime;
    var src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    var bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq;
    bp.Q.value = q;
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.03);
  },

  thump: function(freq, vol, dur){
    var t = this.ctx.currentTime;
    var o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(55, t + dur * 0.8);
    var g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  key: function(){
    this.go(function(){
      var v = this.variants[Math.floor(Math.random() * this.variants.length)];
      var jit = 0.85 + Math.random() * 0.3;
      this.burst(v.f * jit, v.q, v.dur, v.vol * (0.85 + Math.random() * 0.3));
      this.thump(v.thump * jit, 0.4, 0.045);
    });
  },
  space: function(){
    this.go(function(){
      this.burst(600 + Math.random() * 150, 1.4, 0.08, 0.85);
      this.thump(110, 0.5, 0.06);
    });
  },
  backspace: function(){
    this.go(function(){
      this.burst(1400 + Math.random() * 200, 1.2, 0.05, 0.5);
      this.thump(130, 0.28, 0.04);
    });
  },
  enter: function(){
    this.go(function(){
      this.burst(900, 1.1, 0.09, 0.8);
      this.thump(95, 0.55, 0.08);
      var t = this.ctx.currentTime + 0.05;
      var freqs = [1244.5, 2489.0];
      for(var i=0;i<freqs.length;i++){
        var o = this.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freqs[i];
        var g = this.ctx.createGain();
        var peak = i === 0 ? 0.30 : 0.10;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 1.0);
      }
    });
  },

  toggle: function(){
    this.enabled = !this.enabled;
    try{ localStorage.setItem(SOUND_KEY, this.enabled ? 'on' : 'off'); }catch(e){}
    $soundBtn.textContent = this.enabled ? 'SND:ON' : 'SND:OFF';
    if(this.enabled) this.key();   /* confirmation clack */
  }
};

/* unlock audio on the very first user gesture anywhere */
function unlockAudio(){
  if(!Snd.enabled) return;
  Snd.init();
  if(Snd.ctx && Snd.ctx.state !== 'running'){
    Snd.ctx.resume().catch(function(){});
  }
}
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);

/* typing light */
var ledT = null;
function flashLED(){
  $led.classList.add('on');
  clearTimeout(ledT);
  ledT = setTimeout(function(){ $led.classList.remove('on'); }, 90);
}

function handleKeySound(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if(k === 'Enter'){ flashLED(); Snd.enter(); return; }
  if(k === ' ' || k === 'Spacebar'){ flashLED(); Snd.space(); return; }
  if(k === 'Backspace' || k === 'Delete'){ flashLED(); Snd.backspace(); return; }
  if(k.length === 1 || k === 'Tab'){ flashLED(); Snd.key(); }
}
$editor.addEventListener('keydown', handleKeySound);
$title.addEventListener('keydown', handleKeySound);
$soundBtn.addEventListener('click', function(){ Snd.toggle(); });

/* =========================================================
   DRAFTS DRAWER
   ========================================================= */
function fmtDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString(undefined, { day:'numeric', month:'short' }) +
         ' · ' +
         d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

function renderDocList(){
  $docList.innerHTML = '';
  var sorted = state.docs.slice().sort(function(a,b){ return b.updated - a.updated; });
  sorted.forEach(function(d){
    var row = document.createElement('div');
    row.className = 'doc' + (d.id === state.currentId ? ' current' : '');

    var left = document.createElement('div');
    left.style.minWidth = '0';
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = d.title.trim() || 'Untitled';
    var m = document.createElement('div');
    m.className = 'meta';
    m.textContent = fmtDate(d.updated).toUpperCase();
    left.appendChild(t); left.appendChild(m);

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'DEL';
    del.title = 'Delete this piece';
    del.addEventListener('click', function(ev){
      ev.stopPropagation();
      var name = d.title.trim() || 'Untitled';
      if(!confirm('Delete "' + name + '"? This cannot be undone.')) return;
      state.docs = state.docs.filter(function(x){ return x.id !== d.id; });
      if(!state.docs.length){
        var nd = freshDoc();
        state.docs.push(nd);
        state.currentId = nd.id;
      } else if(state.currentId === d.id){
        state.currentId = state.docs[0].id;
      }
      saveNow();
      loadDocIntoEditor();
      renderDocList();
    });

    row.appendChild(left);
    row.appendChild(del);
    row.addEventListener('click', function(){
      state.currentId = d.id;
      saveNow();
      loadDocIntoEditor();
      closeDrawer();
      $editor.focus();
    });
    $docList.appendChild(row);
  });
}

function openDrawer(){
  renderDocList();
  $drawer.classList.add('open');
  $scrim.classList.add('open');
}
function closeDrawer(){
  $drawer.classList.remove('open');
  $scrim.classList.remove('open');
}
function drawerIsOpen(){ return $drawer.classList.contains('open'); }

function newPiece(){
  var d = freshDoc();
  state.docs.push(d);
  state.currentId = d.id;
  saveNow();
  loadDocIntoEditor();
  closeDrawer();
  $title.focus();
}

document.getElementById('drawerBtn').addEventListener('click', function(){
  drawerIsOpen() ? closeDrawer() : openDrawer();
});
document.getElementById('newBtn').addEventListener('click', newPiece);
document.getElementById('drawerNewBtn').addEventListener('click', newPiece);
$scrim.addEventListener('click', closeDrawer);

/* ---------- export ---------- */
function download(filename, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function safeName(s){
  return (s.trim() || 'untitled').replace(/[^a-z0-9 _-]/gi, '').trim().replace(/\s+/g, '-').toLowerCase() || 'untitled';
}
document.getElementById('exportTxtBtn').addEventListener('click', function(){
  var d = currentDoc();
  var head = (d.title.trim() || 'Untitled') + '\n\n';
  download(safeName(d.title) + '.txt', head + d.body);
});
document.getElementById('backupBtn').addEventListener('click', function(){
  download('think-regularly-backup-' + new Date().toISOString().slice(0,10) + '.json',
           JSON.stringify(state, null, 2), 'application/json');
});

/* ---------- global shortcuts ---------- */
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm'){ e.preventDefault(); Snd.toggle(); }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    drawerIsOpen() ? closeDrawer() : openDrawer();
  }
  if(e.key === 'Escape' && drawerIsOpen()){ closeDrawer(); $editor.focus(); }
});

/* ---------- boot ---------- */
$soundBtn.textContent = Snd.enabled ? 'SND:ON' : 'SND:OFF';
loadDocIntoEditor();
window.addEventListener('resize', autogrow);
if(!$editor.value && !$title.value){ $title.focus(); } else { $editor.focus(); }

})();
</script>
</body>
</html>
